name: Bug
description: Something does not work as it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Tap ...
        3. See error
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and system
      placeholder: e.g. iPhone 13, iOS 26 / Samsung A54, Android 15 / backend on Codespaces
  - type: textarea
    id: logs
    attributes:
      label: Error messages or screenshots
      render: shell
