# Opens PRs with dependency updates once a month.
# Add an "npm" entry for /mobile after the Expo app is created.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
    labels: ["dependencies", "backend"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: ["dependencies", "infra"]
